services:
  - type: web
    name: stataxis-production
    runtime: python
    buildCommand: pip install -e .
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 web:application
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: STAXIS_AUTH_SECRET
        sync: false
      - key: STAXIS_ADMIN_EMAIL
        sync: false
      - key: STAXIS_ADMIN_PASSWORD
        sync: false
  - type: worker
    name: stataxis-collector
    runtime: python
    buildCommand: pip install -e .
    startCommand: python -m collector.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: STAXIS_COLLECTION_INTERVAL_SECONDS
        value: "300"
      - key: STAXIS_COLLECTION_MAX_VIDEOS
        value: "25"
      - key: STAXIS_YOUTUBE_REQUESTS_PER_MINUTE
        value: "60"
      - key: STAXIS_YOUTUBE_REQUESTS_PER_DAY
        value: "9000"
