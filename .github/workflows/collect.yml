name: StatAxis Scheduled Collection

# Scheduled collection is disabled: the always-on worker (python -m collector.service)
# runs collection and live polling. Running both would double-collect and burn YouTube quota.
# Trigger manually only for one-off backfills.
on:
  workflow_dispatch:

concurrency:
  group: statax-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run one collection cycle
        run: python -m collector.run_once
