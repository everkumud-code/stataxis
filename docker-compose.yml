services:
  web:
    build: .
    command: ["sh", "-c", "exec gunicorn --bind 0.0.0.0:${PORT:-8000} web:application"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "collector.service"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stataxis
      POSTGRES_USER: stataxis
      POSTGRES_PASSWORD: stataxis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stataxis -d stataxis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
