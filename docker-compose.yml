services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "exec gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 2 --threads 4 --timeout 120 web:application"]

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "collector.service"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stataxis}
      POSTGRES_USER: ${POSTGRES_USER:-stataxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stataxis} -d ${POSTGRES_DB:-stataxis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
