<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Forgot password — StatAxis</title><link rel="icon" href="assets/stataxis-favicon.svg"><style>:root{--bg:#061322;--panel:#0b1b2b;--line:#20394e;--blue:#159de8;--gold:#e1b94f;--text:#e8f0f8;--muted:#7f9ab2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Manrope,Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 24px 70px #0006}.brand{color:var(--gold);font-weight:800;letter-spacing:.08em;font-size:22px}.tag{color:var(--muted);margin:5px 0 22px}label{display:block;color:var(--muted);margin:16px 0 7px}input,button{width:100%;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:#071727;color:var(--text);font:inherit}button{margin-top:16px;background:var(--blue);border:0;font-weight:800;cursor:pointer}button.alt{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}button:disabled{opacity:.6;cursor:wait}h2{font-size:16px;margin:26px 0 0;color:var(--gold)}.note{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0 0}.links{margin-top:20px;color:var(--muted);text-align:center}.links a{color:var(--blue)}.msg{margin-top:15px;padding:11px;border-radius:8px;display:none;line-height:1.5}.msg.ok{display:block;border:1px solid #2f7d5b;color:#8fdcb4}.msg.bad{display:block;border:1px solid #b65b5b;color:#f2b3b3}#code{letter-spacing:2px;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace}</style><link rel="stylesheet" href="/skeuo.css"></head><body><main><section class="card"><div class="brand">STATAXIS</div><div class="tag">Choose a new password</div>
<form id="ask"><label for="login">Email or username</label><input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required><button class="alt" id="send" type="submit">Email me a reset code</button><p class="note">The code goes to the e-mail address of the account and works for 30 minutes. You will see the same message whether or not the account exists. No e-mail? Use one of your backup codes below.</p><div id="m1" class="msg"></div></form>
<h2>Then enter the code</h2>
<form id="reset"><label for="code">Reset code or backup code</label><input id="code" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required><label for="pw1">New password (at least 12 characters)</label><input id="pw1" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="pw2">Repeat the new password</label><input id="pw2" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button id="go" type="submit">Set the new password</button><div id="m2" class="msg"></div></form>
<div class="links"><a href="/login">Back to sign in</a></div></section></main>
<script>
const $=id=>document.getElementById(id),say=(el,t,ok)=>{el.textContent=t;el.className='msg '+(ok?'ok':'bad')};
const frag=new URLSearchParams(location.hash.slice(1));if(frag.get('login'))$('login').value=frag.get('login');if(frag.get('code'))$('code').value=frag.get('code');history.replaceState(null,'',location.pathname);
async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(r.status===429?'Too many tries. Please wait a while and try again.':(d.error||'Something went wrong.'));return d}
$('ask').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{say($('m1'),(await call('/api/v1/auth/forgot',{login:$('login').value})).message,true)}catch(x){say($('m1'),x.message)}$('send').disabled=false};
$('reset').onsubmit=async e=>{e.preventDefault();if($('pw1').value!==$('pw2').value)return say($('m2'),'The two passwords are not the same.');if(!$('login').value.trim())return say($('m2'),'Type your email or username in the first box.');$('go').disabled=true;try{say($('m2'),(await call('/api/v1/auth/reset',{login:$('login').value,code:$('code').value,new_password:$('pw1').value})).message,true);$('pw1').value=$('pw2').value=$('code').value='';setTimeout(()=>location.href='/login',2500)}catch(x){say($('m2'),x.message)}$('go').disabled=false};
</script></body></html>
