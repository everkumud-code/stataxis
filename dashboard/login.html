<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — StatAxis</title><link rel="icon" href="assets/stataxis-favicon.svg"><style>:root{--bg:#061322;--panel:#0b1b2b;--line:#20394e;--blue:#159de8;--gold:#e1b94f;--text:#e8f0f8;--muted:#7f9ab2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Manrope,Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 24px 70px #0006}.brand{color:var(--gold);font-weight:800;letter-spacing:.08em;font-size:22px}.tag{color:var(--muted);margin:5px 0 28px}label{display:block;color:var(--muted);margin:16px 0 7px}input,button{width:100%;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:#071727;color:var(--text);font:inherit}button{margin-top:22px;background:var(--blue);border:0;font-weight:800;cursor:pointer}.links{margin-top:20px;color:var(--muted);text-align:center}.links a{color:var(--blue)}#msg{margin-top:15px;padding:11px;border-radius:8px;display:none}</style></head><body><main><script>localStorage.removeItem('stataxis_token');localStorage.removeItem('stataxis_account');</script><section class="card"><div class="brand">STATAXIS</div><div class="tag">Sign in to your intelligence workspace</div><form id="f"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><div id="msg"></div><div class="links">New to StatAxis? <a href="apply.html">Apply for access</a></div></section></main><script>f.onsubmit=async e=>{e.preventDefault();msg.style.display='block';msg.textContent='Signing in…';try{let r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');sessionStorage.setItem('stataxis_token',d.access_token);sessionStorage.setItem('stataxis_account',JSON.stringify(d.account));location.href=d.account.is_admin?'/admin.html':'/workspace.html'}catch(e){msg.textContent=e.message;msg.style.border='1px solid #b65b5b'}}</script></body></html>
