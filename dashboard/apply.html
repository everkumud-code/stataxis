<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply — StatAxis</title><link rel="icon" href="assets/stataxis-favicon.svg"><style>:root{--bg:#061322;--panel:#0b1b2b;--line:#20394e;--blue:#159de8;--gold:#e1b94f;--text:#e8f0f8;--muted:#7f9ab2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Manrope,Inter,system-ui,sans-serif}main{max-width:820px;margin:auto;padding:45px 20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.brand{color:var(--gold);font-weight:800;letter-spacing:.08em}h1{font-size:34px;margin:8px 0}.sub{color:var(--muted);margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:var(--muted);margin:5px 0 7px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid var(--line);background:#071727;color:var(--text);font:inherit}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}button{background:var(--blue);border:0;font-weight:800;cursor:pointer}.note{margin-top:15px;color:var(--muted);font-size:12px}#msg{margin-top:15px;padding:12px;border-radius:8px;display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><section class="card"><div class="brand">STATAXIS</div><h1>Apply for access</h1><p class="sub">Tell us about your organisation and how you plan to use StatAxis. Applications are reviewed by the StatAxis admin team.</p><form id="f"><div class="grid"><div><label>Full name</label><input id="name" required></div><div><label>Work email</label><input id="email" type="email" required></div><div><label>Mobile</label><input id="mobile" required></div><div><label>Organisation</label><input id="organization" required></div><div><label>Requested plan</label><select id="requested_plan" required><option value="">Select a plan</option><option value="sx_free">SX Free</option><option value="sx_idea">SX Idea</option><option value="sx_intelligence">SX Intelligence</option><option value="sx_analyst">SX Analyst</option><option value="sx_pro">SX Pro</option><option value="sx_corporate">SX Corporate</option><option value="sx_enterprise">SX Enterprise</option></select></div><div><label>Password</label><input id="password" type="password" minlength="12" required></div><div class="full"><label>Purpose of use</label><textarea id="purpose_of_use" required></textarea></div><div class="full"><button>Submit application</button></div></div></form><div id="msg"></div><div class="note">Use a company/organisation email. Public mailbox domains are not accepted.</div></section></main><script>f.onsubmit=async e=>{e.preventDefault();msg.style.display='block';msg.textContent='Submitting application…';const p=Object.fromEntries(['name','email','mobile','organization','purpose_of_use','requested_plan','password'].map(x=>[x,document.getElementById(x).value]));try{let r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(!r.ok)throw Error(d.error||'Application failed');msg.textContent='Application submitted. Your profile is pending admin approval.';f.reset()}catch(e){msg.textContent=e.message;msg.style.border='1px solid #b65b5b'}}</script></body></html>
