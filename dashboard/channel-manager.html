<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Channel Manager — StatAxis</title><style>body{margin:0;background:#061322;color:#eef6ff;font:15px system-ui,-apple-system,sans-serif}main{max-width:980px;margin:0 auto;padding:48px 22px}.card{background:#0b1d31;border:1px solid #24415c;border-radius:16px;padding:24px;margin:18px 0}h1{margin:0 0 8px}h2{color:#e1b94f}label{display:block;margin:14px 0 6px;color:#9fb4c9}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #34536e;background:#071727;color:#fff}button{margin-top:18px;background:#159de8;border:0;font-weight:700;cursor:pointer}.muted{color:#9fb4c9}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){.row{grid-template-columns:1fr}}#status{margin-top:14px;padding:12px;border-radius:9px;display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #20384f}</style></head>
<body><main><h1>StatAxis Channel Manager</h1><p class="muted">Add a YouTube channel to the monitoring universe without changing application code.</p>
<section class="card"><h2>Add channel</h2><label>YouTube channel URL</label><input id="url" placeholder="https://www.youtube.com/@channelname"><div class="row"><div><label>Language</label><input id="language" placeholder="Hindi / English / Tamil / ..."></div><div><label>Region</label><input id="region" placeholder="India / US / UK / ..."></div></div><label>Market (optional)</label><input id="market" placeholder="News / Business / Sports / ..."><label>Display name (optional)</label><input id="name" placeholder="Channel name"><button id="add">Add to monitoring universe</button><div id="status"></div></section>
<section class="card"><h2>Current monitoring universe</h2><div id="list" class="muted">Loading…</div></section>
<script>
const $=id=>document.getElementById(id); const status=(msg,ok=true)=>{$('status').textContent=msg;$('status').style.display='block';$('status').style.border='1px solid '+(ok?'#159de8':'#b65b5b')};
async function load(){try{const r=await fetch('/api/v1/channels');const d=await r.json();$('list').innerHTML=d.channels?.length?'<table><tr><th>Name</th><th>Language</th><th>Region</th></tr>'+d.channels.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.language||'—')}</td><td>${esc(c.region||'—')}</td></tr>`).join('')+'</table>':'No active channels.'}catch(e){$('list').textContent='Unable to load channel catalog.'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
$('add').onclick=async()=>{const url=$('url').value.trim(); if(!url)return status('Enter a YouTube channel URL.',false); status('Channel submission endpoint is being wired to the authenticated admin API.',true)}; load();
</script></main></body></html>
