<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Workspace — StatAxis</title>
<link rel="icon" href="assets/stataxis-favicon.svg">
<style>
:root{--bg:#061322;--panel:#0b1b2b;--panel2:#0f2438;--line:#20394e;--muted:#7f9ab2;--text:#e8f1f8;--blue:#159de8;--gold:#e1b94f;--green:#35d399;--red:#ff7180;--amber:#f2a93b}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#061322;padding:8px 12px;border-radius:6px;font-weight:800;z-index:50}
.skip:focus{left:8px}

.top{height:60px;background:#071725;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
.logo{font-weight:900;letter-spacing:.16em;font-size:17px}
.logo small{display:block;font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-top:1px}
.plan{border:1px solid #8b7131;color:var(--gold);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}
.who{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;line-height:1.3}
.who b{display:block;color:var(--text);font-weight:700}
.btn{border:1px solid var(--line);background:#091a29;color:#dbe8f1;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#04121f}
.btn.primary:hover{background:var(--gold);border-color:var(--gold);color:#061322}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.side h2{margin:14px 10px 6px;font-size:12px;font-weight:700;color:#5d7891;letter-spacing:.04em}
.side h2:first-child{margin-top:4px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:#9eb2c2;text-decoration:none;font-weight:650}
.nav:hover{background:#0e2438;color:var(--text)}
.nav[aria-current="page"]{background:#10304a;color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.nav .lock{color:var(--muted);font-size:11px;font-weight:600}

.main{padding:22px 26px 60px;max-width:1500px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin-bottom:6px}
.head h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.lede{color:var(--muted);margin:4px 0 16px;max-width:75ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=url]{background:#091a29;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:140px}
input::placeholder{color:#59738a}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.cols{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h2,.card h3{margin:0 0 10px;font-size:16px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2;margin:3px 0;overflow-wrap:anywhere}
.kpi .v.name{font-size:22px}
.kpi .s{color:var(--muted);font-size:12.5px}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.wrap{overflow-x:auto}
.tbl th{text-align:left;color:var(--muted);font-weight:650;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #152c40;vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}

.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:750;border:1px solid var(--line)}
.badge.ok{color:var(--green);border-color:#1f6b52}
.badge.warn{color:var(--amber);border-color:#7a5a20}
.badge.bad{color:var(--red);border-color:#7c3039}

.bar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar i{display:block;height:8px;border-radius:99px;background:#122a3f;overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #152c40}
.list li:last-child{border-bottom:0}
.decide{border-left:3px solid var(--blue);padding:4px 0 4px 12px;margin:0 0 14px}
.decide:last-child{margin-bottom:0}
.decide b{display:block}
.evidence{margin-top:16px;padding:10px 14px;border:1px dashed #2b4a63;border-radius:8px;color:var(--muted);font-size:12.5px}
.evidence strong{color:var(--text)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{border:1px solid var(--line);background:#091a29;color:#9eb2c2;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:#10304a;color:var(--text);border-color:var(--gold)}

.state{padding:26px;border:1px dashed #2b4a63;border-radius:10px;background:#081827}
.state h3{margin:0 0 6px}
.state p{margin:0 0 10px;color:var(--muted);max-width:70ch}
.err{border-color:#7c3039}

.chart{position:relative;touch-action:pan-y}
.chart:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.chart svg{cursor:crosshair}
.spark .cx{stroke:var(--gold);stroke-width:1;stroke-dasharray:4 4}
.spark .cd{fill:var(--gold);stroke:#061322;stroke-width:2}
.tip{position:absolute;pointer-events:none;z-index:6;min-width:170px;max-width:260px;background:#0d2236;border:1px solid #2b4a63;border-radius:8px;padding:9px 11px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tip .t{color:var(--muted);margin-bottom:4px}.tip .v{font-size:16px;font-weight:800;color:var(--gold)}
.tip table{width:100%;border-collapse:collapse;margin-top:6px}.tip td{padding:1px 0;border:0}.tip td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.spark{width:100%;height:auto;display:block}
.spark path.line{fill:none;stroke:var(--blue);stroke-width:2}
.spark path.area{fill:rgba(21,157,232,.12);stroke:none}
.spark text{fill:var(--muted);font-size:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:grid;gap:10px;max-width:560px}
.form label{display:grid;gap:4px;color:var(--muted);font-size:12.5px}
.form input{width:100%}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0f2438;border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.chip b{color:var(--gold);margin-left:6px}


.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.chform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.chform label{display:grid;gap:4px;color:var(--muted);font-size:12.5px}
.chform input,.pkg input:not([type=checkbox]){width:100%;min-width:0}
.pkg td{padding:6px 8px}
.pkg input:not([type=checkbox]),input[type=number]{background:#091a29;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.msg{padding:10px 12px;border-radius:8px;margin-top:12px;background:#0b2032}
.msg.ok{color:var(--green)}.msg.bad{color:var(--red)}
input[type=number],input[type=text]{min-width:0}

.dh{display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(0,2.4fr);gap:18px;align-items:center;margin-bottom:14px}
.av{width:74px;height:74px;border-radius:50%;background:#10304a;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--gold);overflow:hidden;border:2px solid #2b4a63}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.dh h2{margin:0;font-size:24px;line-height:1.2}
.dh .sub{color:var(--muted);margin:2px 0 8px}
.dk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dk .card{padding:12px 14px}.dk .v{font-size:22px}
.cmp{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 12px}
.cmp label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bars h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:650}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.hb i{display:block;height:9px;border-radius:99px;background:#122a3f;overflow:hidden}.hb i b{display:block;height:100%;background:var(--blue)}
.hb.c1 i b{background:var(--gold)}.hb.c2 i b{background:var(--green)}.hb.c3 i b{background:#b18cff}.hb.c4 i b{background:#ff8fa3}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vids li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.vids .th{width:120px;aspect-ratio:16/9;border-radius:8px;background:#10304a;overflow:hidden}
.vids .th img{width:100%;height:100%;object-fit:cover;display:block}
.vids b{display:block;overflow-wrap:anywhere}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#122a3f;margin:6px 0 2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.g21{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
.ins{margin:0;padding-left:18px}.ins li{margin:6px 0}
@media(max-width:900px){.g21{grid-template-columns:minmax(0,1fr)}.dh{grid-template-columns:auto 1fr}.dh .dk{grid-column:1/-1}.vids li{grid-template-columns:96px 1fr}.vids .th{width:96px}}
@media(max-width:900px){
  .chform{grid-template-columns:1fr 1fr}
  .chform>*:first-child{grid-column:1/-1}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side h2{display:none}
  .nav{white-space:nowrap}
  .main{padding:16px 14px 50px}
  .who{display:none}
  .bar{grid-template-columns:110px 1fr 46px}
  .row2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <div class="logo">STATAXIS<small>Intelligence workspace</small></div>
  <span class="plan" id="plan" hidden></span>
  <div class="who" id="who"></div>
  <button class="btn" id="signout" type="button">Sign out</button>
</header>

<div class="layout">
  <nav class="side" id="nav" aria-label="Workspace sections"></nav>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const compact = n => n == null || !isFinite(n) ? "—" : new Intl.NumberFormat("en-US", {notation: "compact", maximumFractionDigits: 1}).format(n);
const whole = n => n == null || !isFinite(n) ? "—" : Number(n).toLocaleString("en-IN");
const dec = (n, d = 1) => n == null || !isFinite(n) ? "—" : Number(n).toLocaleString("en-IN", {maximumFractionDigits: d});
/* Confidence arrives on two scales today: 0-100 (STX Index) and 0-1 (what-changed).
   The smallest possible STX confidence is 5, so anything <= 1 is a fraction. */
const pct = c => c == null || !isFinite(c) ? "—" : Math.round(c <= 1 ? c * 100 : c) + "%";
const when = iso => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString("en-IN", {dateStyle: "medium", timeStyle: "short"}); };
const signed = n => n == null ? "—" : (n > 0 ? "+" : "") + whole(n);

/* ---------- session ---------- */
const token = () => sessionStorage.getItem("stataxis_token") || localStorage.getItem("stataxis_access_token") || "";
const account = () => { try { return JSON.parse(sessionStorage.getItem("stataxis_account") || localStorage.getItem("stataxis_account") || "null"); } catch { return null; } };
function signOut() {
  ["stataxis_token", "stataxis_account", "sx_ws_filters"].forEach(k => sessionStorage.removeItem(k));
  ["stataxis_access_token", "stataxis_account"].forEach(k => localStorage.removeItem(k));
  location.href = "login.html";
}
const acct = account();
if (!acct || !token()) { location.replace("login.html"); }

/* ---------- API ---------- */
class ApiError extends Error { constructor(status, message) { super(message); this.status = status; } }
const cache = new Map();
async function api(path, params = {}, opts = {}) {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v !== "" && v != null) q.set(k, v);
  const url = path + (q.toString() ? "?" + q : "");
  const key = (opts.method || "GET") + " " + url;
  if (!opts.method && cache.has(key) && Date.now() - cache.get(key).t < 60000) return cache.get(key).d;
  let res;
  try {
    res = await fetch(url, {
      method: opts.method || "GET",
      headers: {Authorization: "Bearer " + token(), ...(opts.body ? {"Content-Type": "application/json"} : {})},
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch { throw new ApiError(0, "Could not reach the server. Check your connection and try again."); }
  let data = null; try { data = await res.json(); } catch { /* non-JSON body */ }
  const msg = (data && data.error) || res.statusText || "Request failed";
  if (res.status === 401 && !/premium|plan/i.test(msg)) { signOut(); throw new ApiError(401, "Session expired"); }
  if (!res.ok) throw new ApiError(res.status, msg);
  if (!opts.method) cache.set(key, {t: Date.now(), d: data});
  return data;
}
const friendly = e => e.status === 403 || /premium/i.test(e.message)
  ? "This is not included in your current plan."
  : e.status === 404 ? "This data is not available yet."
  : e.status >= 500 ? "The server could not complete this request. Try again in a moment."
  : e.message;

/* ---------- state ---------- */
const PERIODS = [["1h","Last hour"],["3h","Last 3 hours"],["6h","Last 6 hours"],["today","Today"],["7d","Last 7 days"],["3w","Last 3 weeks"],["month","Last month"],["quarter","Last quarter"],["year","Last year"]];
const SCOPES = [["all","All streams"],["live","Live"],["replay","Live replays"],["video","Videos"]];
const F = Object.assign({language: "", period: "7d", stream: "all", channel: ""}, JSON.parse(sessionStorage.getItem("sx_ws_filters") || "{}"));
let channels = [];
const saveF = () => sessionStorage.setItem("sx_ws_filters", JSON.stringify(F));
const channelName = id => (channels.find(c => c.id === Number(id)) || {}).name || "Channel " + id;
const marketReport = (scope = F.stream) => api("/api/v1/markets/report", {period: F.period, language: F.language, stream_scope: scope, limit: 200});
const readiness = () => api("/api/v1/operations/readiness", {min_snapshot_coverage: 0.5});

/* ---------- UI building blocks ---------- */
const kpi = (l, v, s = "", cls = "") => `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v ${cls}">${esc(v)}</div><div class="s">${esc(s)}</div></div>`;
const state = (title, body, action = "", cls = "") => `<div class="state ${cls}"><h3>${esc(title)}</h3><p>${esc(body)}</p>${action}</div>`;
const badge = (ok, yes, no, warn) => `<span class="badge ${ok === true ? "ok" : ok === false ? "bad" : "warn"}">${esc(ok === true ? yes : ok === false ? no : warn)}</span>`;
const bar = (label, value) => { const v = Math.max(0, Math.min(100, Number(value) || 0)); return `<div class="bar"><span>${esc(label)}</span><i><b style="width:${v}%"></b></i><span>${value == null ? "—" : Math.round(v) + "%"}</span></div>`; };
const evidence = text => `<div class="evidence"><strong>Evidence.</strong> ${esc(text)} Missing values are shown as “—”, never as zero.</div>`;
const retry = () => `<button class="btn" data-retry type="button">Try again</button>`;
const errCard = e => state("This section could not load", friendly(e), retry(), "err");

function table(cols, rows, empty = "No rows to show.") {
  if (!rows.length) return `<p class="muted">${esc(empty)}</p>`;
  return `<div class="wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.n ? "n" : ""}">${c.html ? c.v(r) : esc(c.v(r))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const CHARTS = new Map();
let chartSeq = 0;
const SKIP_KEYS = new Set(["observed_at", "total_concurrent", "value"]);
const fullTime = d => isNaN(d) ? "" : d.toLocaleString("en-IN", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
function spark(points, key = "value", label = "", {breakdown = false} = {}) {
  const pts = points.map(p => ({t: p.observed_at, v: Number(p[key]),
    parts: breakdown ? Object.entries(p).filter(([k, val]) => !SKIP_KEYS.has(k) && typeof val === "number").sort((a, b) => b[1] - a[1]) : []})).filter(p => isFinite(p.v));
  if (pts.length < 2) return `<p class="muted">Not enough observations yet to draw a trend. At least two are needed.</p>`;
  const W = 900, H = 210, L = 8, R = 8, T = 26, B = 28;
  const min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v)), rng = Math.max(max - min, 1);
  const x = i => L + i / (pts.length - 1) * (W - L - R), y = v => T + (1 - (v - min) / rng) * (H - T - B);
  const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const d0 = new Date(pts[0].t), d1 = new Date(pts[pts.length - 1].t), short = (d1 - d0) < 2 * 864e5;
  const f = d => isNaN(d) ? "" : short ? d.toLocaleTimeString("en-IN", {hour: "2-digit", minute: "2-digit"}) : d.toLocaleDateString("en-IN", {day: "numeric", month: "short"});
  const id = "c" + (++chartSeq);
  CHARTS.set(id, {pts, W, H, L, R, T, B, x, y, label, idx: pts.length - 1});
  return `<div class="chart" data-chart="${id}" tabindex="0" aria-label="${esc(label)} chart. Move the pointer, or use the left and right arrow keys, to read the value at a time.">
    <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} from ${esc(f(d0))} to ${esc(f(d1))}, low ${esc(compact(min))}, high ${esc(compact(max))}">
    <path class="area" d="${line} L${x(pts.length - 1)} ${H - B} L${L} ${H - B} Z"/><path class="line" d="${line}"/>
    <line class="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="cd" r="5" cx="0" cy="0" visibility="hidden"/>
    <text x="${L}" y="14">High ${esc(compact(max))} · Low ${esc(compact(min))}</text>
    <text x="${L}" y="${H - 8}">${esc(f(d0))}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${esc(f(d1))}</text></svg>
    <div class="tip" hidden></div></div>`;
}
function showTip(box, i) {
  const c = CHARTS.get(box.dataset.chart); if (!c) return;
  i = Math.max(0, Math.min(c.pts.length - 1, i)); c.idx = i;
  const p = c.pts[i], svg = box.querySelector("svg"), tip = box.querySelector(".tip");
  const cx = c.x(i), cy = c.y(p.v);
  const line = svg.querySelector(".cx"), dot = svg.querySelector(".cd");
  line.setAttribute("x1", cx); line.setAttribute("x2", cx); line.setAttribute("visibility", "visible");
  dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
  tip.innerHTML = `<div class="t">${esc(fullTime(new Date(p.t)))}</div><div class="v">${esc(whole(p.v))}</div><div class="muted">${esc(c.label)}</div>` +
    (p.parts.length ? `<table>${p.parts.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(whole(v))}</td></tr>`).join("")}</table>` : "");
  tip.hidden = false;
  const r = svg.getBoundingClientRect(), px = cx / c.W * r.width, py = cy / c.H * r.height, tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(r.width - tw, px + 14 > r.width - tw ? px - tw - 14 : px + 14)) + "px";
  tip.style.top = Math.max(0, py - tip.offsetHeight - 10) + "px";
}
function hideTip(box) {

}
document.addEventListener("pointermove", e => {

  const c = CHARTS.get(box.dataset.chart); if (!c) return;
  const r = box.querySelector("svg").getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * c.W;
  showTip(box, Math.round((xv - c.L) / (c.W - c.L - c.R) * (c.pts.length - 1)));
});
document.addEventListener("pointerout", e => { const box = e.target.closest && e.target.closest(".chart"); if (box && !box.contains(e.relatedTarget)) hideTip(box); });
document.addEventListener("keydown", e => {

    try { const d = await post("/api/v1/admin/channels", {url: fd.url, display_name: fd.display_name, language: fd.language, region: fd.region, market: fd.market});
      msg.className = "msg ok"; msg.textContent = "Added " + d.name; f.reset(); f.region.value = "India"; await reloadChannels(); draw();
    } catch (e) { msg.className = "msg bad"; msg.textContent = e.message; }
    btn.disabled = false;
  };
}, {admin: 1});

add("adm-packages", "Admin", "Packages 5–40", async el => {
  if (!isAdmin) { el.innerHTML = adminOnly("Packages"); return; }
  el.innerHTML = head("Packages 5–40", "Commercial name, criteria, amount and currency for each package slot.") + `<div id="pk"><p class="muted">Loading…</p></div>`;
  const d = await api("/api/v1/admin/packages");
  const inp = (id, v, extra = "") => `<input id="${id}" value="${esc(v ?? "")}" ${extra}>`;
  $("#pk", el).innerHTML = `<section class="card"><div class="wrap"><table class="tbl pkg"><thead><tr><th>Slot</th><th>Name</th><th>Criteria (separate with |)</th><th>Amount</th><th>Currency</th><th>Active</th><th></th></tr></thead><tbody>${
    d.packages.map(p => `<tr><td>${esc(p.slot)}</td><td>${inp("pn" + p.slot, p.name, `placeholder="Package ${esc(p.slot)}"`)}</td><td>${inp("pc" + p.slot, (p.criteria || []).join(" | "), 'placeholder="criteria 1 | criteria 2"')}</td>
    <td>${inp("pa" + p.slot, p.amount, 'type="number" min="0"')}</td><td>${inp("pu" + p.slot, p.currency || "INR", 'maxlength="3"')}</td>
    <td><input id="px${esc(p.slot)}" type="checkbox"${p.active ? " checked" : ""}></td><td><button class="btn primary" type="button" data-adm="savepkg" data-id="${esc(p.slot)}">Save</button></td></tr>`).join("")}</tbody></table></div></section>`;
}, {admin: 1});

async function adminAction(b) {
  const act = b.dataset.adm, id = Number(b.dataset.id);
  if (act === "approve" || act === "reject") { await post("/api/v1/admin/users/" + act, {user_id: id}); render(); }
  else if (act === "rename") {
    const name = prompt("New display name:", b.dataset.name || ""); if (name === null) return;
    if (!name.trim()) return alert("Name is required");
    await post("/api/v1/admin/channels/rename", {channel_id: id, display_name: name}); render();
  } else if (act === "remove") {
    if (!confirm("Remove this channel from monitoring?")) return;
    await post("/api/v1/admin/channels/deactivate", {channel_id: id}); render();
  } else if (act === "savepkg") {
    const g = k => document.getElementById(k + id), amount = g("pa").value;
    await post("/api/v1/admin/packages/configure", {slot: id, name: g("pn").value, criteria: g("pc").value.split("|").map(x => x.trim()).filter(Boolean),
      amount: amount === "" ? null : Number(amount), currency: g("pu").value, active: g("px").checked});
    alert("Package " + id + " saved");
  }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-adm]"); if (b) adminAction(b).catch(err => alert(err.message)); });

/* ---------- csv ---------- */
function downloadCsv(rows, name) {
  const cell = v => { let s = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s; };
  const head = ["Rank", "Channel", "Views gained", "Average concurrent", "Peak concurrent", "Views per minute", "STX", "STX confidence (0-100)"];
  const body = rows.map(r => [r.rank, r.channel, r.view_delta, r.average_concurrent, r.peak_concurrent, r.view_velocity_per_minute, r.stx && r.stx.score, r.stx && r.stx.score != null ? Math.round(r.stx.confidence <= 1 ? r.stx.confidence * 100 : r.stx.confidence) : ""]);
  const blob = new Blob(["\ufeff" + [head, ...body].map(r => r.map(cell).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- shell ---------- */
function buildNav(current) {
  let last = "", html = "";
  for (const v of Object.values(VIEWS)) {
    if (v.admin && !isAdmin) continue;
    if (v.group !== last) { html += `<h2>${esc(v.group)}</h2>`; last = v.group; }
    html += `<a class="nav" href="#/${v.id}"${v.id === current ? ' aria-current="page"' : ""}>${esc(v.title)}</a>`;
  }
  $("#nav").innerHTML = html;
}
let seq = 0;
async function render() {
  const id = (location.hash.match(/^#\/([a-z-]+)/) || [])[1]; let v = VIEWS[id] || VIEWS.dashboard; if (v.admin && !isAdmin) v = VIEWS.dashboard; const mine = ++seq;
  CHARTS.clear();
  const host = $("#view"), el = document.createElement("div");
  buildNav(v.id); document.title = v.title + " — StatAxis workspace"; el.innerHTML = `<p class="muted">Loading…</p>`; host.replaceChildren(el);
  try { await v.render(el); }
  catch (e) { if (mine !== seq) return; el.innerHTML = head(v.title, "") + errCard(e); }
  if (mine !== seq) return;
  el.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => { cache.clear(); render(); });
  const f = el.querySelector("[data-filters]");
  if (f) f.onsubmit = ev => { ev.preventDefault(); const fd = new FormData(f); for (const [k, val] of fd.entries()) F[k] = val; saveF(); render(); };
}
window.addEventListener("hashchange", () => { render(); $("#view").focus({preventScroll: true}); });
$("#signout").onclick = signOut;

(async function boot() {
  if (!acct) return;
  const p = $("#plan"); if (isAdmin) { p.textContent = "Admin"; p.hidden = false; } else if (acct.plan) { p.textContent = acct.plan.replace(/^sx_/, "SX ").replace(/\b\w/g, c => c.toUpperCase()); p.hidden = false; }
  $("#who").innerHTML = `<b>${esc(acct.full_name || acct.email || "")}</b>${esc(acct.organization || "")}`;
  try { channels = (await api("/api/v1/channels")).channels || []; } catch { channels = []; }
  render();
})();
</script>
