<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — StatAxis</title><link rel="icon" href="assets/stataxis-favicon.svg"><style>:root{--bg:#061322;--panel:#0b1b2b;--line:#20394e;--blue:#159de8;--gold:#e1b94f;--text:#e8f0f8;--muted:#7f9ab2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Manrope,Inter,system-ui,sans-serif}.top{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:#071725}.brand{font-weight:800;color:var(--gold);letter-spacing:.08em;margin-right:auto}main{max-width:1200px;margin:auto;padding:30px 20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.muted{color:var(--muted)}button{background:var(--blue);border:0;color:var(--text);padding:10px 14px;border-radius:8px;font-weight:800}a{color:var(--blue)}</style></head><body><header class="top"><div class="brand">STATAXIS</div><span id="plan" class="muted"></span></header><main><div class="card"><h1>Welcome to your StatAxis workspace</h1><p class="muted">Your approved intelligence workspace will surface the markets, channels and capabilities included in your plan.</p><p id="details"></p></div><div class="card"><h2>Explore</h2><p><a href="demo.html">View product demonstration</a></p><p><a href="media-intelligence.html">Media Intelligence</a></p></div></main><script>const a=JSON.parse(localStorage.getItem('stataxis_account')||'null');if(!a){location.href='login.html'}plan.textContent=a?.plan||'';details.textContent=(a?.full_name||'')+' · '+(a?.organization||'');</script></body></html>
