[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "stataxis"
version = "0.1.0"
description = "Digital media intelligence and audience measurement platform"
requires-python = ">=3.12"
dependencies = [
  "gunicorn>=23,<24",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["api*", "collector*", "metrics*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# CI focuses on import errors, syntax/runtime errors, and undefined names.
# Pure formatting/style cleanup remains separate from the release gate.
select = ["E4", "E9", "F"]
per-file-ignores = { "tests/*" = ["F401", "F841"] }

[tool.ruff.lint.isort]
known-first-party = ["collector", "metrics", "api"]
